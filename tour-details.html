<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Allow all HTTPS & data images; add referrer suppression to help with hosts that reject hot‑links -->
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' https: data:;">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mile Zero Tours – Tour Details</title>
  <style>
  #loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
  pointer-events: all;
  transition: opacity 0.4s ease;
}

#loading-overlay img {
  width: 100px;
  height: 100px;
  object-fit: contain;
}

#loading-overlay.fade-out {
  opacity: 0;
  pointer-events: none;
}

    /* --------------------------
       Base & Utility Styles
    --------------------------*/
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:"Roboto",Arial,sans-serif;line-height:1.6;color:#111;background:#fff;opacity:0;animation:fadeIn .8s ease-out forwards}
    @keyframes fadeIn{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
    h1,h2,h3,h4,h5,h6{margin:0 0 .5em;font-weight:600;color:#40671d}
    ul{margin:0 0 1em 1.25em;padding:0}
    li+li{margin-top:.25em}

    /* --------------------------
       Header
    --------------------------*/
    .header-banner{padding:3.5rem 0 5.5rem;color:#fff;background-size:cover;background-position:center;text-align:center;animation:fadeSlideDown .9s ease-out .2s both}
    @keyframes fadeSlideDown{0%{opacity:0;transform:translateY(-20px)}100%{opacity:1;transform:translateY(0)}}
    .header-banner .brand{font-size:clamp(.9rem,3vw,1.25rem);letter-spacing:1px;color:#e9e9e9;margin-bottom:.25rem;text-transform:uppercase;opacity:.85}
    #i2nbno{font-size:clamp(2.25rem,6vw,4.5rem);text-shadow:1px 1px 12px rgba(0,0,0,.55)}
    #iyfdd9{font-size:clamp(.9rem,2.25vw,1.15rem);color:#fff;margin-top:.5rem}

    /* --------------------------
       Call‑to‑Action Bar
    --------------------------*/



    /* --------------------------
       Main Grid Layout
    --------------------------*/
    .gjs-grid-row{display:grid;grid-template-columns:3fr 1fr;gap:2rem;padding:2rem clamp(1rem,4vw,3rem);align-items:start;animation:slideUp .9s ease-out .4s both}
    @keyframes slideUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
    @media(max-width:992px){.gjs-grid-row{grid-template-columns:1fr}}

    /* --------------------------
       Sidebar Styling
    --------------------------*/
    #imjqz7{background:#000;color:#fff;padding:2rem 1.5rem;border-radius:.5rem;display:flex;flex-direction:column;gap:1.25rem}
    #imjqz7 h3,#imjqz7 b,#imjqz7 li{color:#fff}
    #what-included-list,#hotels-list{margin-left:1rem}
    #what-included-list li::marker,#hotels-list li::marker{color:#7ec83d}
    #imjqz7 li{transition:opacity .25s ease;padding-left:.25rem}
    #imjqz7 li:hover{opacity:.85;padding-left:.5rem}

    /* --------------------------
       Carousel Images
    --------------------------*/
    .carousel-wrapper{overflow:hidden;width:100%;position:relative;margin:0 clamp(1rem,4vw,3rem) 2rem;height:240px}
    .carousel-track{display:flex;gap:1rem;transition:transform .6s ease-in-out}
    .carousel-track img{flex:0 0 350px;height:240px;border-radius:.5rem;object-fit:cover}
    @media(max-width:600px){.carousel-track img{flex:0 0 280px;height:200px}}

    /* Carousel arrows */
    .carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .carousel-arrow:hover{background:rgba(0,0,0,.75)}
    .arrow-left{left:8px}
    .arrow-right{right:8px}

    /* --------------------------
       Policies Section
    --------------------------*/
    #iq5mrz{font-size:clamp(1.3rem,3vw,1.75rem);text-align:center}
    #ij4jeh{font-size:.95rem;text-align:center;max-width:700px;margin:0 auto}
  </style>
</head>
<body id="ie7rq6">
  <!-- ========================= Header ========================= -->
  <header id="igtuih" class="header-banner">
    <p class="brand">Mile&nbsp;Zero&nbsp;Tours</p>
    <h1 id="i2nbno">Tour&nbsp;Name</h1>
    <p id="iyfdd9"></p>
  </header>

  <!-- ========================= Call‑to‑Action Bar ========================= -->
// will add laterb
  <!-- ========================= Main Content ========================= -->
  <section class="gjs-grid-row" id="ib7z6a">
    <article id="ie9bjl" class="gjs-grid-column">
      <h2 id="infbcg">Full Itinerary:</h2>
      <div id="ided1x">nothing :(</div>
    </article>

    <aside id="imjqz7" class="gjs-grid-column">
      <div id="in9eov"><strong>What's included:</strong></div>
      <ul id="what-included-list"><!-- filled dynamically --></ul>
      <h3 id="izlyuj"><span id="i8dj9c">Hotels:</span></h3>
      <ul id="hotels-list"><!-- filled dynamically --></ul>
    </aside>
  </section>

  <!-- ========================= Carousel Images ========================= -->
  <div class="carousel-wrapper">
    <button class="carousel-arrow arrow-left" aria-label="Previous">&#10094;</button>
    <div id="image-container" class="carousel-track"><!-- images appended here --></div>
    <button class="carousel-arrow arrow-right" aria-label="Next">&#10095;</button>
  </div>

  <!-- ========================= Policies ========================= -->
  <section id="ifq8wu" class="gjs-section text-center">
    <div class="gjs-container">
      <h2 id="iq5mrz">Tour Policies</h2>
      <div id="ij4jeh">nothing :(</div>
    </div>
  </section>

  <!-- ========================= Scripts ========================= -->


<script>
/* ========= CONFIG ========= */
const sheetId = '1o0AUq13j-7LZWDhCwFYgq07niZtvOya5iE5bbRQMGWc';
const apiKey  = 'AIzaSyAhgfTNBOeYYRTjpboOGbZsc-XZH8T6Xbw';

/* ========= HELPERS ========= */
// Extracts #param and automatically URI‑decodes it
const getHashParam = key => {
  const param = new URLSearchParams(location.hash.slice(1)).get(key);
  return param ? decodeURIComponent(param) : null;
};
const toHttps = url => {
  if(!url) return '';
  url=url.trim();
  if(url.startsWith('https://')) return url;
  if(url.startsWith('http://'))  return url.replace('http://','https://');
  if(url.startsWith('//'))       return 'https:'+url;
  if(url[0]!=='/')              url='/'+url;
  return 'https://www.milezerotours.net'+url;
};

/* ========= MAIN ========= */
async function loadTour() {
  const loadingEl = document.getElementById('loading-overlay');
  loadingEl?.classList.remove('fade-out'); // Show loading overlay

  const code = getHashParam('tour');
  if (!code) {
    console.warn('Missing #tour param');
    loadingEl?.classList.add('fade-out');
    return;
  }

  try {
    // 1. Fetch spreadsheet data to get .tour JSON path
    const sheetURL = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:AL1000?key=${apiKey}`;
    const sheet = await fetch(sheetURL).then(r => r.json());
    const row = sheet.values.find(r => r[0] && r[0].includes(code));

    if (!row) {
      console.error('Tour code not found');
      return;
    }

    const tourURL = toHttps(row[37]);
    if (!tourURL) {
      console.error('Tour URL in Column AL is missing');
      return;
    }

    // 2. Fetch tour JSON data
    const tour = await fetch(tourURL).then(r => r.json());

    // 3. Get element handles
    const bannerEl   = document.getElementById('igtuih');
    const nameEl     = document.getElementById('i2nbno');
    const factsEl    = document.getElementById('iyfdd9');
    const itinEl     = document.getElementById('ided1x');
    const incEl      = document.getElementById('what-included-list');
    const hotelsEl   = document.getElementById('hotels-list');
    const policiesEl = document.getElementById('ij4jeh');
    const track      = document.getElementById('image-container');

    // 4. Populate content
    if (bannerEl && tour.banner)
      bannerEl.style.backgroundImage = `linear-gradient(rgba(21,21,21,.65),rgba(21,21,21,.65)),url(${tour.banner})`;

    if (nameEl) nameEl.textContent = tour.metadata?.name || 'Tour Name';

    if (factsEl) {
      const parts = [];
      if (tour.overview?.days) parts.push(`${tour.overview.days} days`);
      if (tour.overview?.meals) parts.push(tour.overview.meals);
      if (Number.isFinite(tour.overview?.pricePerPerson))
        parts.push(`$${tour.overview.pricePerPerson.toLocaleString()} pp`);
      if (Number.isFinite(tour.overview?.earlyDiscount) && tour.overview.earlyDiscount > 0)
        parts.push(`$${tour.overview.earlyDiscount.toLocaleString()} early‑bird off`);
      factsEl.innerHTML = parts.join(' | ');
    }

    if (itinEl) itinEl.innerHTML = tour.itinerary?.map(p => `<p>${p}</p>`).join('') || 'No itinerary available.';
    if (incEl)  incEl.innerHTML  = tour.included?.map(i => `<li>${i}</li>`).join('') || '';
    if (hotelsEl) hotelsEl.innerHTML = tour.hotels?.map(h => `<li>${h.name}</li>`).join('') || '';
    if (policiesEl) policiesEl.innerHTML = tour.policies || '';

    if (track && Array.isArray(tour.carousel)) {
      track.innerHTML = '';
      tour.carousel.forEach(src => {
        const img = new Image();
        img.src = src;
        track.appendChild(img);
      });
    }
  } catch (e) {
    console.error('Error loading tour:', e);
  } finally {
    // 5. Hide loading overlay
    loadingEl?.classList.add('fade-out');
  }
}


/* ========= CAROUSEL ========= */
function initCarousel(){
  const track=document.getElementById('image-container');
  const left =document.querySelector('.arrow-left');
  const right=document.querySelector('.arrow-right');
  if(!(track&&left&&right)) return;
  let offset=0;
  const slide=dir=>{
    if(!track.firstElementChild) return;
    const w=track.firstElementChild.offsetWidth||350;
    offset+=dir*w;
    const max=track.scrollWidth-track.clientWidth;
    if(offset<0) offset=max; else if(offset>max) offset=0;
    track.style.transform=`translateX(-${offset}px)`;
  };
  left.addEventListener('click',()=>slide(-1));
  right.addEventListener('click',()=>slide(1));
}

window.addEventListener('DOMContentLoaded',()=>{
  initCarousel();
  loadTour();
});
</script>

</body>
