<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Allow all HTTPS & data images; add referrer suppression to help with hosts that reject hot‑links -->
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' https: data:;">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mile Zero Tours – Tour Details</title>
  <style>
    /* --------------------------
       Base & Utility Styles
    --------------------------*/
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:"Roboto",Arial,sans-serif;line-height:1.6;color:#111;background:#fff;opacity:0;animation:fadeIn .8s ease-out forwards}
    @keyframes fadeIn{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
    h1,h2,h3,h4,h5,h6{margin:0 0 .5em;font-weight:600;color:#40671d}
    ul{margin:0 0 1em 1.25em;padding:0}
    li+li{margin-top:.25em}

    /* --------------------------
       Header
    --------------------------*/
    .header-banner{padding:3.5rem 0 5.5rem;color:#fff;background-size:cover;background-position:center;text-align:center;animation:fadeSlideDown .9s ease-out .2s both}
    @keyframes fadeSlideDown{0%{opacity:0;transform:translateY(-20px)}100%{opacity:1;transform:translateY(0)}}
    .header-banner .brand{font-size:clamp(.9rem,3vw,1.25rem);letter-spacing:1px;color:#e9e9e9;margin-bottom:.25rem;text-transform:uppercase;opacity:.85}
    #i2nbno{font-size:clamp(2.25rem,6vw,4.5rem);text-shadow:1px 1px 12px rgba(0,0,0,.55)}
    #iyfdd9{font-size:clamp(.9rem,2.25vw,1.15rem);color:#fff;margin-top:.5rem}

    /* --------------------------
       Call‑to‑Action Bar
    --------------------------*/
    #book-now-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:1.25rem;background:#1f940d;color:#fff;padding:.6rem 2.4rem;font-size:clamp(1rem,2.5vw,1.25rem);border-radius:1.25rem;z-index:999;font-weight:700;box-shadow:0 4px 8px rgba(0,0,0,.25);transition:transform .25s ease,box-shadow .25s ease}
    #book-now-bar:hover{transform:translate(-50%,-4px) scale(1.05);box-shadow:0 8px 14px rgba(0,0,0,.35)}
    #book-now-bar a{color:inherit;text-decoration:none}

    /* --------------------------
       Main Grid Layout
    --------------------------*/
    .gjs-grid-row{display:grid;grid-template-columns:3fr 1fr;gap:2rem;padding:2rem clamp(1rem,4vw,3rem);align-items:start;animation:slideUp .9s ease-out .4s both}
    @keyframes slideUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
    @media(max-width:992px){.gjs-grid-row{grid-template-columns:1fr}}

    /* --------------------------
       Sidebar Styling
    --------------------------*/
    #imjqz7{background:#000;color:#fff;padding:2rem 1.5rem;border-radius:.5rem;display:flex;flex-direction:column;gap:1.25rem}
    #imjqz7 h3,#imjqz7 b,#imjqz7 li{color:#fff}
    #what-included-list,#hotels-list{margin-left:1rem}
    #what-included-list li::marker,#hotels-list li::marker{color:#7ec83d}
    #imjqz7 li{transition:opacity .25s ease;padding-left:.25rem}
    #imjqz7 li:hover{opacity:.85;padding-left:.5rem}

    /* --------------------------
       Carousel Images
    --------------------------*/
    .carousel-wrapper{overflow:hidden;width:100%;position:relative;margin:0 clamp(1rem,4vw,3rem) 2rem;height:240px}
    .carousel-track{display:flex;gap:1rem;transition:transform .6s ease-in-out}
    .carousel-track img{flex:0 0 350px;height:240px;border-radius:.5rem;object-fit:cover}
    @media(max-width:600px){.carousel-track img{flex:0 0 280px;height:200px}}

    /* Carousel arrows */
    .carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .carousel-arrow:hover{background:rgba(0,0,0,.75)}
    .arrow-left{left:8px}
    .arrow-right{right:8px}

    /* --------------------------
       Policies Section
    --------------------------*/
    #iq5mrz{font-size:clamp(1.3rem,3vw,1.75rem);text-align:center}
    #ij4jeh{font-size:.95rem;text-align:center;max-width:700px;margin:0 auto}
  </style>
</head>
<body id="ie7rq6">
  <!-- ========================= Header ========================= -->
  <header id="igtuih" class="header-banner">
    <p class="brand">Mile&nbsp;Zero&nbsp;Tours</p>
    <h1 id="i2nbno">Tour&nbsp;Name</h1>
    <p id="iyfdd9"></p>
  </header>

  <!-- ========================= Call‑to‑Action Bar ========================= -->
  <div id="book-now-bar"><a href="https://milezerotours.com/booking" target="_blank" id="i35l8s"><span id="i7j86o">Book&nbsp;Now</span></a></div>

  <!-- ========================= Main Content ========================= -->
  <section class="gjs-grid-row" id="ib7z6a">
    <article id="ie9bjl" class="gjs-grid-column">
      <h2 id="infbcg">Full Itinerary:</h2>
      <div id="ided1x">nothing :(</div>
    </article>

    <aside id="imjqz7" class="gjs-grid-column">
      <div id="in9eov"><strong>What's included:</strong></div>
      <ul id="what-included-list"><!-- filled dynamically --></ul>
      <h3 id="izlyuj"><span id="i8dj9c">Hotels:</span></h3>
      <ul id="hotels-list"><!-- filled dynamically --></ul>
    </aside>
  </section>

  <!-- ========================= Carousel Images ========================= -->
  <div class="carousel-wrapper">
    <button class="carousel-arrow arrow-left" aria-label="Previous">&#10094;</button>
    <div id="image-container" class="carousel-track"><!-- images appended here --></div>
    <button class="carousel-arrow arrow-right" aria-label="Next">&#10095;</button>
  </div>

  <!-- ========================= Policies ========================= -->
  <section id="ifq8wu" class="gjs-section text-center">
    <div class="gjs-container">
      <h2 id="iq5mrz">Tour Policies</h2>
      <div id="ij4jeh">nothing :(</div>
    </div>
  </section>

  <!-- ========================= Scripts ========================= -->
  <script>
  console.log("script works -- ALEX");

  // Helper: get URL parameter
  function getUrlParameter(name){name=name.replace(/[/\[\]]/g,"\\$&");const regex=new RegExp("[#&]"+name+"(=([^&#]*)|&|#|$)");const results=regex.exec(window.location.href);if(!results)return null;if(!results[2])return '';return decodeURIComponent(results[2].replace(/\+/g," "))}

  // Proxy helper to bypass CORS / hot‑link blocks using images.weserv.nl
  function proxyImage(url){if(!url)return url;const stripped=url.replace(/^https?:\/\//,'');return `https://images.weserv.nl/?url=${encodeURIComponent(stripped)}`;}

  // Carousel controls
  const track=document.getElementById('image-container');
  let position=0;
  function moveCarousel(dir){const cardWidth=track.querySelector('img')?.offsetWidth||350;position+=dir*cardWidth;const maxScroll=track.scrollWidth-track.clientWidth;if(position<0)position=maxScroll;else if(position>maxScroll)position=0;track.style.transform=`translateX(-${position}px)`;}
  document.querySelector('.arrow-left').addEventListener('click',()=>moveCarousel(-1));
  document.querySelector('.arrow-right').addEventListener('click',()=>moveCarousel(1));

  // Google Sheets API fetch
  function fetchDataFromGoogleSheets(){
    const sheetId='1o0AUq13j-7LZWDhCwFYgq07niZtvOya5iE5bbRQMGWc';
    const apiKey='AIzaSyAhgfTNBOeYYRTjpboOGbZsc-XZH8T6Xbw';
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:AL1000?key=${apiKey}`;

    fetch(url)
      .then(resp=>resp.json())
      .then(data=>{
        const tourCode=getUrlParameter('tour');
        if(!tourCode){console.error('No tour param');return;}
        const row=data.values.find(r=>r[0]&&r[0].includes(tourCode));
        if(!row){console.warn('Tour not found');window.open('tour404.html','_blank');return;}

        // Column mapping
        const tourName=row[1];
        const colC=row[2], colF=row[5], colG=row[6], colH=row[7], colI=row[8];
        const colL=row[11];
        const colW=row[22], colX=row[23], colY=row[24], colZ=row[25];
        const colAD=row[30]; // Banner image URL
        const colAG=row[32], colAI=row[34], colAK=row[36];
        const colAL=row[37];

        // Populate UI
        document.getElementById('i2nbno').innerText=tourName;
        document.getElementById('iyfdd9').innerHTML=`${colC} days ${colF}<br>$${colG} Per Person<br>Single Add: $${colH}&nbsp;|&nbsp;Triple deduct: $${colI}<br>${colL?`Own air deduct: $${colL}<br>`:''}${colAL?`$${colAL} Early Booking Discount<br>`:''}`;
        document.getElementById('ided1x').innerHTML=colW;
        document.getElementById('what-included-list').innerHTML=colX;
        document.getElementById('hotels-list').innerHTML=colY.replace(/\n/g,'<br>');
        document.getElementById('ij4jeh').innerHTML=colZ;

        // Images into carousel track using proxy
        const imageUrls=[colAG,colAI,colAK].filter(Boolean).map(proxyImage);
        imageUrls.forEach(url=>{const img=new Image();img.src=url;img.alt='Tour Image';img.loading='lazy';track.appendChild(img);});

        // Banner background via proxy
        const bannerUrl=proxyImage(colAD);
        document.querySelector('.header-banner').style.backgroundImage=`linear-gradient(rgba(21,21,21,0.65),rgba(21,21,21,0.65)),url('${bannerUrl}')`;
      })
      .catch(err=>console.error('Error fetching data from Google Sheets:',err));
  }

  window.addEventListener('DOMContentLoaded',fetchDataFromGoogleSheets);
  </script>
</body>
</html>
